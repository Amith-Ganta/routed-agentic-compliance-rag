[project]
name = "ai-job-search-project-2"
version = "0.1.0"
description = "Multi-tenant agentic RAG platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "litellm>=1.74.0",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.0",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "deepeval>=4.2.0",
    "pytest>=9.1.1",
]
