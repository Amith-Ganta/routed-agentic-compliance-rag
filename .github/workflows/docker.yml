name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: tessera-api:ci

      - name: Smoke test /health
        run: |
          docker run --rm -d --name tessera-smoke -p 8000:8000 -e TESSERA_ENV=dev tessera-api:ci
          trap 'docker stop tessera-smoke >/dev/null 2>&1 || true' EXIT
          status=""
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "Health check ok"
              break
            fi
            sleep 2
          done
          if [ "$status" != "200" ]; then
            echo "Health check failed (last status: ${status:-no response})"
            docker logs tessera-smoke || true
            exit 1
          fi
